[package]
name = "footon-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64 = "0.22.1"
bytes = "1.10.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "serde", "std", "wasmbind"] }
footon-core = { path = "../crates/footon-core" }
getrandom = { version = "0.4.3", features = ["wasm_js"] }
http = "1.3.1"
http-body-util = "0.1.3"
pulldown-cmark = { version = "0.13.4", default-features = false, features = ["html"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
serde_urlencoded = "0.7.1"
sha2 = "0.10.9"
subtle = "2.6.1"
topcoat = { version = "=0.5.0", default-features = false, features = ["cookie", "router", "ui", "view"] }
url = "2.5.7"
wasm-bindgen = "0.2.104"
worker = { version = "=0.8.5", features = ["d1", "http"] }

[build-dependencies]
topcoat = { version = "=0.5.0", default-features = false, features = ["tailwind"] }

[dev-dependencies]
tokio = { version = "1.47.1", features = ["macros", "rt"] }

[lints]
workspace = true
