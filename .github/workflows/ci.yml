name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and package verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default 1.95.0

      - name: Install Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install locked build and audit tools
        run: |
          cargo install worker-build --version 0.8.5 --locked
          cargo install cargo-audit --version 0.22.2 --locked
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Validate workflows
        run: actionlint -shellcheck=

      - name: Run complete release gate
        run: npm run verify:release

  cli-platforms:
    name: CLI - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
          - macos-15-intel
          - windows-2025
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust 1.95
        shell: bash
        run: |
          rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
          rustup default 1.95.0

      - name: Test CLI
        run: cargo test --locked -p footon
