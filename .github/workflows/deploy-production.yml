name: Deploy production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Draft release tag to deploy, such as v0.1.0
        required: true
        type: string
      rollback_version:
        description: Current known-good Worker version ID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate, deploy, and smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify tag and rollback inputs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$(git describe --tags --exact-match)" = "${{ inputs.tag }}"
          test -n "${{ inputs.rollback_version }}"
          test "$(gh release view "${{ inputs.tag }}" --json isDraft --jq .isDraft)" = true

      - name: Install Rust 1.95
        run: |
          rustup toolchain install 1.95.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.95.0

      - name: Install Node 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          package-manager-cache: false

      - name: Install dependencies and Worker build tool
        run: |
          npm ci
          cargo install worker-build --version 0.8.5 --locked

      - name: Record pre-deploy state
        id: source
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/footon-smoke"
          sha=$(git rev-parse HEAD)
          printf '%s\n' "$sha" > "$RUNNER_TEMP/footon-smoke/commit.txt"
          printf 'sha=%s\n' "$sha" >> "$GITHUB_OUTPUT"
          printf '%s\n' "${{ inputs.tag }}" > "$RUNNER_TEMP/footon-smoke/tag.txt"
          printf '%s\n' "${{ inputs.rollback_version }}" > "$RUNNER_TEMP/footon-smoke/rollback-version.txt"
          npx wrangler d1 info footon > "$RUNNER_TEMP/footon-smoke/d1-info.txt"
          npx wrangler d1 time-travel info footon > "$RUNNER_TEMP/footon-smoke/d1-bookmark-before.txt"
          npx wrangler d1 migrations list footon --remote > "$RUNNER_TEMP/footon-smoke/migrations-before.txt"

      - name: Apply production migrations
        run: npx wrangler d1 migrations apply footon --remote

      - name: Read back production migrations
        shell: bash
        run: |
          npx wrangler d1 migrations list footon --remote > "$RUNNER_TEMP/footon-smoke/migrations-after.txt"
          npx wrangler d1 time-travel info footon > "$RUNNER_TEMP/footon-smoke/d1-bookmark-after.txt"

      - name: Deploy tagged Worker
        env:
          CLOUDFLARE_OUTPUT_FILE_PATH: ${{ runner.temp }}/footon-smoke/wrangler-events.jsonl
        run: npx wrangler deploy --message "release ${{ inputs.tag }} commit ${{ steps.source.outputs.sha }}"

      - name: Record deployment and public smoke results
        shell: bash
        run: |
          npx wrangler deployments list --json > "$RUNNER_TEMP/footon-smoke/deployments-after.json"
          curl --fail --silent --show-error --dump-header "$RUNNER_TEMP/footon-smoke/health.headers" --output "$RUNNER_TEMP/footon-smoke/health.json" https://footon.dev/healthz
          curl --fail --silent --show-error --dump-header "$RUNNER_TEMP/footon-smoke/home-html.headers" --output "$RUNNER_TEMP/footon-smoke/home.html" https://footon.dev/
          curl --fail --silent --show-error --header 'Accept: text/markdown' --dump-header "$RUNNER_TEMP/footon-smoke/home-markdown.headers" --output "$RUNNER_TEMP/footon-smoke/home.md" https://footon.dev/
          curl --fail --silent --show-error --dump-header "$RUNNER_TEMP/footon-smoke/oauth.headers" --output "$RUNNER_TEMP/footon-smoke/oauth.json" https://footon.dev/.well-known/oauth-authorization-server
          curl --fail --silent --show-error --dump-header "$RUNNER_TEMP/footon-smoke/privacy.headers" --output "$RUNNER_TEMP/footon-smoke/privacy.html" https://footon.dev/privacy
          curl --fail --silent --show-error --header 'Accept: text/markdown' --output "$RUNNER_TEMP/footon-smoke/privacy.md" https://footon.dev/privacy
          curl --fail --silent --show-error --dump-header "$RUNNER_TEMP/footon-smoke/terms.headers" --output "$RUNNER_TEMP/footon-smoke/terms.html" https://footon.dev/terms
          curl --fail --silent --show-error --header 'Accept: text/markdown' --output "$RUNNER_TEMP/footon-smoke/terms.md" https://footon.dev/terms
          curl --fail --silent --show-error --dump-header "$RUNNER_TEMP/footon-smoke/pricing.headers" --output "$RUNNER_TEMP/footon-smoke/pricing.html" https://footon.dev/pricing
          curl --fail --silent --show-error --header 'Accept: text/markdown' --output "$RUNNER_TEMP/footon-smoke/pricing.md" https://footon.dev/pricing
          curl --fail --silent --show-error --dump-header "$RUNNER_TEMP/footon-smoke/security.headers" --output "$RUNNER_TEMP/footon-smoke/security.html" https://footon.dev/security
          curl --fail --silent --show-error --header 'Accept: text/markdown' --output "$RUNNER_TEMP/footon-smoke/security.md" https://footon.dev/security
          curl --fail --silent --show-error --dump-header "$RUNNER_TEMP/footon-smoke/support.headers" --output "$RUNNER_TEMP/footon-smoke/support.html" https://footon.dev/support
          curl --fail --silent --show-error --header 'Accept: text/markdown' --output "$RUNNER_TEMP/footon-smoke/support.md" https://footon.dev/support
          curl --fail --silent --show-error --head --dump-header "$RUNNER_TEMP/footon-smoke/home-head.headers" --output /dev/null https://footon.dev/
          test "$(tr -d '[:space:]' < "$RUNNER_TEMP/footon-smoke/health.json")" = '{"status":"ok"}'

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-smoke-${{ inputs.tag }}-${{ github.run_id }}
          path: ${{ runner.temp }}/footon-smoke
          if-no-files-found: error
          retention-days: 90

      - name: Print recovery command
        if: always()
        run: echo 'npx wrangler rollback ${{ inputs.rollback_version }} --message "rollback release ${{ inputs.tag }}"'
