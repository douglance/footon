[package]
name = "footon"
version = "0.2.0"
edition = "2024"
rust-version.workspace = true
description = "Sanitize and explicitly publish agent conversations to footon.dev"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["agents", "privacy", "redaction", "sharing", "cli"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
base64 = "0.22"
blake3 = "1.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
footon-core = { version = "=0.2.0", path = "../crates/footon-core" }
incurs = { version = "=0.5.2", default-features = false, features = ["cli", "mcp"] }
keyring = "4.1.6"
rand = "0.10"
redact-core = "=0.9.1"
regex = "1.12"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread"] }
url = "2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cognitive_complexity = "deny"
too_many_lines = "deny"
