[workspace]
members = ["cli", "crates/footon-core", "worker"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Douglas Lance"]
homepage = "https://footon.dev"
repository = "https://github.com/douglance/footon"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
